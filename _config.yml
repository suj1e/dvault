# ── 站点基础信息 ──
title: dvault
description: 一个用 Markdown 写就的知识保险库
url: "https://dvault.flooc.cn"
lang: zh-CN

# ── 主题(GitHub Pages 原生支持 remote_theme,无需 Gemfile)──
remote_theme: just-the-docs/just-the-docs@v0.12.0

# ── 站内搜索 ──
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/   # 支持中文/连字符分词
  rel_url: true
  button: false
  focus_shortcut_key: 'k'         # Ctrl/Cmd + K 快速唤起搜索

# ── 导航侧边栏 ──
nav_enabled: true

# ── 右上角辅助链接 ──
aux_links:
  "GitHub 仓库":
    - "https://github.com/suj1e/dvault"
aux_links_new_tab: true

# ── 页内标题锚点 ──
heading_anchors: true

# ── 排除不需要渲染的文件 ──
exclude:
  - README.md
  - LICENSE
  - CNAME
